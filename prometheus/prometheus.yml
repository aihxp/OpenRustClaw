# Prometheus configuration for OpenRustClaw monitoring
#
# This configuration scrapes metrics from the OpenRustClaw gateway
# and other services. Adjust the targets to match your deployment.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'openrustclaw'
    replica: '{{.ExternalURL}}'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      # Uncomment and configure if using Alertmanager
      # - targets: ['alertmanager:9093']

# Load alerting rules
rule_files:
  # - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # OpenRustClaw Gateway metrics
  # The gateway exposes metrics at /metrics on its HTTP port
  - job_name: 'openrustclaw-gateway'
    static_configs:
      - targets: ['localhost:8080']
        labels:
          service: 'gateway'
          environment: 'production'
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    # Health check for the target
    # fallback_scrape_protocol: "PrometheusProto"

  # If running multiple gateway instances, use file-based discovery
  # - job_name: 'openrustclaw-gateway-file'
  #   file_sd_configs:
  #     - files:
  #         - /etc/prometheus/gateway-targets.json
  #       refresh_interval: 30s
  #   metrics_path: /metrics
  #   scrape_interval: 10s

  # OpenRustClaw Sidecar metrics (if metrics endpoint is exposed)
  - job_name: 'openrustclaw-sidecar'
    static_configs:
      - targets: ['localhost:8000']
        labels:
          service: 'sidecar'
    metrics_path: /metrics
    scrape_interval: 15s

  # Node exporter for system metrics (if installed)
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['localhost:9100']
  #   scrape_interval: 15s

  # cAdvisor for container metrics (if running in Docker)
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
  #   scrape_interval: 15s

# Remote write configuration for long-term storage
# (e.g., Thanos, Cortex, VictoriaMetrics)
