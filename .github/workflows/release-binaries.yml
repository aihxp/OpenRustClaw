name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release-artifacts:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            install: sudo apt-get update && sudo apt-get install -y protobuf-compiler gcc-aarch64-linux-gnu
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          - os: macos-13
            target: x86_64-apple-darwin
            install: brew install protobuf
          - os: macos-14
            target: aarch64-apple-darwin
            install: brew install protobuf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install target dependencies
        if: ${{ matrix.install != '' }}
        run: ${{ matrix.install }}
      - name: Install default Linux build dependency
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.install == '' }}
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build packaged artifacts
        run: |
          chmod +x scripts/build-release-artifacts.sh
          scripts/build-release-artifacts.sh --target "${{ matrix.target }}" --output dist
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: openrustclaw-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish-github-release:
    name: Publish GitHub Release Assets
    runs-on: ubuntu-latest
    needs: build-release-artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Flatten release assets
        run: |
          mkdir -p dist
          find dist-artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} dist/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
