name: Shipped Surface CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  parity-inventory:
    name: Parity Inventory Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parity contract dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Validate parity contract docs
        run: |
          test -f docs/feature-matrix.md
          test -f docs/roadmap.md
          test -f docs/surface-matrix.md
          test -f docs/product-positioning.md
          test -f .github/release.yml
          rg -n '## Core Runtime|## Experience Layers' docs/feature-matrix.md
          rg -n '## Scope Split|## Phase 1 Completion Note' docs/surface-matrix.md
          rg -n '## What It Ships Well|## Where It Is Intentionally Stronger|## Current Boundaries' docs/product-positioning.md
          rg -n '\[feature-matrix.md\]|\[surface-matrix.md\]|\[product-positioning.md\]' docs/roadmap.md
      - name: Validate repo hygiene contract
        run: |
          chmod +x scripts/check-repo-hygiene.sh
          scripts/check-repo-hygiene.sh

  check:
    name: Shipped Surface Check
    runs-on: ubuntu-latest
    needs: parity-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev
      - run: cargo check --workspace

  test:
    name: Shipped Surface Test
    runs-on: ubuntu-latest
    needs: parity-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev
      - run: cargo test --workspace --lib

  clippy:
    name: Shipped Surface Clippy (Informational)
    runs-on: ubuntu-latest
    needs: parity-inventory
    # Informational only until workspace-wide lint debt is reduced to a
    # stable gate. Keep the signal visible without failing the shipped-surface
    # workflow on unrelated historical cleanup work.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Shipped Surface Format
    runs-on: ubuntu-latest
    needs: parity-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  runtime-budget:
    name: Runtime Budget Checks
    runs-on: ubuntu-latest
    needs: parity-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev
      - run: chmod +x scripts/check-runtime-budgets.sh
      - run: scripts/check-runtime-budgets.sh

  security-audit:
    name: Shipped Surface Security Audit
    runs-on: ubuntu-latest
    needs: parity-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: chmod +x scripts/check-security-audit.sh
      - run: scripts/check-security-audit.sh
