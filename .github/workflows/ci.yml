name: Shipped Surface CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  parity-inventory:
    name: Parity Inventory Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate parity contract docs
        run: |
          test -f docs/feature-matrix.md
          test -f docs/roadmap.md
          test -f docs/parity-matrix.md
          test -f docs/parity-positioning.md
          test -f .github/release.yml
          rg -n 'OpenClaw feature family|Scope Split|Phase 1 Completion Note' docs/parity-matrix.md
          rg -n 'What We Already Match Well|Where OpenRustClaw Is Intentionally Stronger|Current Claim Boundary' docs/parity-positioning.md
          rg -n '\[x\] Build a full OpenClaw parity matrix' docs/roadmap.md
          rg -n '\[x\] Split parity targets into:' docs/roadmap.md
          rg -n '\[x\] Add a `docs/parity-matrix.md` artifact' docs/roadmap.md
          rg -n '\[x\] Add parity labels to CI and release notes' docs/roadmap.md
          rg -n '\[x\] Add a single page that explains which OpenClaw features are matched' docs/roadmap.md

  check:
    name: Shipped Surface Check
    runs-on: ubuntu-latest
    needs: parity-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo check --workspace

  test:
    name: Shipped Surface Test
    runs-on: ubuntu-latest
    needs: parity-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test --workspace --lib

  clippy:
    name: Shipped Surface Clippy
    runs-on: ubuntu-latest
    needs: parity-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Shipped Surface Format
    runs-on: ubuntu-latest
    needs: parity-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  security-audit:
    name: Shipped Surface Security Audit
    runs-on: ubuntu-latest
    needs: parity-inventory
    # Informational only -- upstream transitive dependency advisories
    # (e.g. protobuf v2 via raft, rsa via sqlx-mysql) cannot be fixed here
    continue-on-error: true
    permissions:
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ github.token }}
