# OpenRustClaw Development Docker Compose
# Hot reload for Rust and Python development

version: "3.8"

services:
  openrustclaw-rust:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: rust-dev
    image: openrustclaw-rust:dev
    container_name: openrustclaw-rust-dev
    
    environment:
      - RUST_LOG=${RUST_LOG:-debug}
      - RUST_BACKTRACE=1
      - APP_ENV=development
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=18789
      - DATABASE_URL=sqlite:///app/data/openrustclaw.db
      - DATABASE_WAL_MODE=true
      - SIDECAR_GRPC_HOST=openrustclaw-sidecar
      - SIDECAR_GRPC_PORT=50051
      - SIDECAR_AUTO_START=false
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-openrustclaw-dev}
      - AUTH_SECRET=dev-secret-not-for-production
    
    ports:
      - "18789:18789"
      - "9090:9090"
    
    volumes:
      # Source code for hot reload
      - ./crates:/app/crates:ro
      - ./proto:/app/proto:ro
      - ./Cargo.toml:/app/Cargo.toml:ro
      - ./config:/app/config:ro
      # Build cache (persisted)
      - rust_target_cache:/app/target
      # Data persistence
      - openrustclaw_dev_data:/app/data
      # Logs
      - ./logs:/app/logs
    
    working_dir: /app
    
    command: >
      cargo watch 
        --watch crates 
        --watch proto 
        --watch Cargo.toml 
        -x 'run --bin openrustclaw -- start --sidecar-host openrustclaw-sidecar'
    
    depends_on:
      - openrustclaw-sidecar
    
    networks:
      - openrustclaw-dev-network

  openrustclaw-sidecar:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: python-dev
    image: openrustclaw-sidecar:dev
    container_name: openrustclaw-sidecar-dev
    
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - SIDECAR_PORT=50051
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-openrustclaw-dev}
      - PYTHONUNBUFFERED=1
    
    ports:
      - "50051:50051"
    
    volumes:
      # Python source for hot reload
      - ./sidecar/src:/app/sidecar/src
      - ./proto:/app/proto:ro
    
    working_dir: /app/sidecar/src
    
    command: >
      python -m watchdog.observers 
        --pattern="*.py" 
        --command="python server.py --port 50051 --log-level DEBUG"
    
    # Alternative: Use watchdog for file watching
    # command: >
