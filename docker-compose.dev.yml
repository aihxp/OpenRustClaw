    #         observer.stop()
    #         if handler.process:
    #             handler.process.terminate()
    #     observer.join()
    #   "
    
    networks:
      - openrustclaw-dev-network

  # Optional: Database viewer for development
  sqlite-web:
    image: coleifer/sqlite-web:latest
    container_name: openrustclaw-sqlite-web
    profiles:
      - db-ui
    environment:
      - SQLITE_DATABASE=/data/openrustclaw.db
      - SQLITE_WEB_PASSWORD=${DB_UI_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes:
      - openrustclaw_dev_data:/data
    command: ["sqlite_web", "-H", "0.0.0.0", "-p", "8080", "/data/openrustclaw.db"]
    networks:
      - openrustclaw-dev-network

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: openrustclaw-prometheus
    profiles:
      - monitoring
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - openrustclaw-dev-network

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: openrustclaw-grafana
    profiles:
      - monitoring
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - openrustclaw-dev-network

networks:
  openrustclaw-dev-network:
    driver: bridge

volumes:
  openrustclaw_dev_data:
    driver: local
  rust_target_cache:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
