[package]
name = "openrustclaw-integration-tests"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Internal crates
openrustclaw-core = { path = "../../crates/core" }
openrustclaw-db = { path = "../../crates/db" }
openrustclaw-memory = { path = "../../crates/memory" }
openrustclaw-providers = { path = "../../crates/providers" }
openrustclaw-mcp = { path = "../../crates/mcp" }
openrustclaw-agent = { path = "../../crates/agent" }
openrustclaw-gateway = { path = "../../crates/gateway" }
openrustclaw-scheduler = { path = "../../crates/scheduler" }
openrustclaw-security = { path = "../../crates/security" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }

# Security
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
jsonwebtoken = "9"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Test dependencies
wiremock = "0.6"
serial_test = "3"
tempfile = "3"
