[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "crates/memory",
    "crates/providers",
    "crates/mcp",
    "crates/mcp2cli",
    "crates/agent",
    "crates/gateway",
    "crates/channels",
    "crates/skills",
    "crates/scheduler",
    "crates/security",
    "crates/langbridge",
    "crates/observability",
    "crates/cli",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["OpenRustClaw Contributors"]
repository = "https://github.com/openrustclaw/openrustclaw"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
libsql = "0.6"
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }
eventsource-stream = "0.2"

# gRPC
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

# Security
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"

# WASM sandboxing
wasmtime = "27"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
prometheus = "0.13"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
config = "0.14"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tiktoken-rs = "0.6"
dashmap = "6"
backoff = { version = "0.4", features = ["tokio"] }
bytes = "1"
url = "2"
hex = "0.4"

# Internal crates
openrustclaw-core = { path = "crates/core" }
openrustclaw-db = { path = "crates/db" }
openrustclaw-memory = { path = "crates/memory" }
openrustclaw-providers = { path = "crates/providers" }
openrustclaw-mcp = { path = "crates/mcp" }
openrustclaw-agent = { path = "crates/agent" }
openrustclaw-gateway = { path = "crates/gateway" }
openrustclaw-channels = { path = "crates/channels" }
openrustclaw-skills = { path = "crates/skills" }
openrustclaw-scheduler = { path = "crates/scheduler" }
openrustclaw-security = { path = "crates/security" }
openrustclaw-langbridge = { path = "crates/langbridge" }
openrustclaw-observability = { path = "crates/observability" }
openrustclaw-mcp2cli = { path = "crates/mcp2cli" }

# OpenAPI parsing
openapiv3 = "2.0"

# Caching
cached = { version = "0.54", features = ["async", "tokio"] }

# Base64 (for OAuth)
base64 = "0.22"

# URL encoding
urlencoding = "2"

# Test dependencies
wiremock = "0.6"
serial_test = "3"
tempfile = "3"
tokio-test = "0.4"
