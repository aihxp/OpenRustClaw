[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/cloudflare_ai",
    "crates/deepseek",
    "crates/ollama_sdk",
    "crates/fireworks",
    "crates/gemini",
    "crates/groq",
    "crates/mistral",
    "crates/llama_cpp",
    "crates/bedrock",
    "crates/replicate",
    "crates/core",
    "crates/distributed",
    "crates/db",
    "crates/memory",
    "crates/providers",
    "crates/mcp",
    "crates/mcp2cli",
    "crates/agent",
    "crates/gateway",
    "crates/channels",
    "crates/skills",
    "crates/scheduler",
    "crates/security",
    "crates/optimization",
    "crates/canvas",
    "crates/langbridge",
    "crates/observability",
    "crates/cursor",
    "crates/automation",
    "crates/voice",
    "crates/mobile",
    "crates/anthropic_rust",
    "crates/async_openai",
    "crates/openrouter_api",
    "crates/together",
    "crates/cohere",
    "crates/perplexity",
    "crates/azure_openai",
    "crates/ai21",
    "crates/vllm",
    "crates/cli",
    "tests/integration",
    "tests/e2e",
    "benches",
]

[workspace.package]
version = "1.4.8"
edition = "2024"
license = "MIT"
authors = ["OpenRustClaw Contributors"]
repository = "https://github.com/aihxp/OpenRustClaw"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
libsql = "0.6"
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
eventsource-stream = "0.2"

# gRPC
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

# Security
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
jsonwebtoken = "9"
rand = "0.8"
secrecy = { version = "0.10", features = ["serde"] }

# WASM sandboxing
wasmtime = "27"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "tracing-log"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
prometheus = "0.13"
metrics = "0.24"

# HTTP
http = "1"
http-body-util = "0.1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
config = "0.14"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tiktoken-rs = "0.6"
dashmap = "6"
backoff = { version = "0.4", features = ["tokio"] }
bytes = "1"
url = "2"
hex = "0.4"
regex = "1"
glob = "0.3"
walkdir = "2"

# Internal crates
cloudflare-ai = { path = "crates/cloudflare_ai" }
openrustclaw-core = { path = "crates/core" }
openrustclaw-app = { path = "crates/app" }
openrustclaw-db = { path = "crates/db" }
openrustclaw-memory = { path = "crates/memory" }
openrustclaw-providers = { path = "crates/providers" }
openrustclaw-mcp = { path = "crates/mcp" }
openrustclaw-agent = { path = "crates/agent" }
openrustclaw-gateway = { path = "crates/gateway" }
openrustclaw-channels = { path = "crates/channels" }
openrustclaw-skills = { path = "crates/skills" }
openrustclaw-scheduler = { path = "crates/scheduler" }
openrustclaw-security = { path = "crates/security" }
openrustclaw-optimization = { path = "crates/optimization" }
openrustclaw-langbridge = { path = "crates/langbridge" }
openrustclaw-observability = { path = "crates/observability" }
openrustclaw-cursor = { path = "crates/cursor" }
openrustclaw-canvas = { path = "crates/canvas" }
openrustclaw-mcp2cli = { path = "crates/mcp2cli" }
openrustclaw-distributed = { path = "crates/distributed" }
openrustclaw-automation = { path = "crates/automation" }
openrustclaw-voice = { path = "crates/voice" }
openrustclaw-mobile = { path = "crates/mobile" }

# Native SDK crates
deepseek = { path = "crates/deepseek" }
ollama-sdk = { path = "crates/ollama_sdk" }
fireworks-ai = { path = "crates/fireworks" }
google-gemini = { path = "crates/gemini" }
groq = { path = "crates/groq" }
mistral = { path = "crates/mistral" }
llama-cpp = { path = "crates/llama_cpp" }
replicate = { path = "crates/replicate" }
anthropic-rust = { path = "crates/anthropic_rust" }
async-openai = { path = "crates/async_openai" }
openrouter-api = { path = "crates/openrouter_api" }
together-ai = { path = "crates/together" }
cohere = { path = "crates/cohere" }
perplexity = { path = "crates/perplexity" }
azure-openai = { path = "crates/azure_openai" }
aws-bedrock = { path = "crates/bedrock" }
ai21 = { path = "crates/ai21" }
vllm = { path = "crates/vllm" }

# OpenAPI parsing
openapiv3 = "2.0"

# Caching
cached = { version = "0.54", features = ["async", "tokio"] }

# Base64 (for OAuth)
base64 = "0.22"

# MIME types
mime = "0.3"

# Testing
mockito = "1"

# URL encoding
urlencoding = "2"

# Compression
flate2 = "1"

# CLI/UX
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"

# Test dependencies
wiremock = "0.6"
serial_test = "3"
tempfile = "3"
tokio-test = "0.4"
proptest = "1"

[profile.bench]
debug = true
lto = "thin"
