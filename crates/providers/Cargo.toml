[package]
name = "openrustclaw-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LLM provider integrations for OpenRustClaw (Anthropic, OpenAI, OpenRouter, Ollama)"

[features]
default = ["native-sdks"]
native-sdks = ["anthropic-rust", "async-openai", "openrouter-api"]
legacy-http = []

[dependencies]
openrustclaw-core.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
eventsource-stream.workspace = true
dashmap.workspace = true
backoff.workspace = true
chrono.workspace = true
uuid.workspace = true
url.workspace = true
bytes.workspace = true
pin-project-lite.workspace = true

# Native SDK crates (optional, enabled by default)
anthropic-rust = { workspace = true, optional = true, features = ["streaming", "batch"] }
async-openai = { workspace = true, optional = true, features = ["streaming", "chat", "embeddings"] }
openrouter-api = { workspace = true, optional = true, features = ["streaming", "routing"] }
