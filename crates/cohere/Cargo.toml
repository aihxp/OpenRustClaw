[package]
name = "cohere"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native Rust SDK for Cohere's API with chat, embeddings, rerank, classify, and more"
readme = "README.md"
keywords = ["cohere", "ai", "llm", "embeddings", "api"]
categories = ["api-bindings", "asynchronous", "science"]
rust-version = "1.85"

[features]
default = ["rustls-tls", "streaming", "chat", "embeddings"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
streaming = ["eventsource-stream", "futures"]
chat = []
generate = []
embeddings = []
rerank = []
classify = []
summarize = []
tokenize = []
full = ["chat", "generate", "embeddings", "rerank", "classify", "summarize", "tokenize"]

[dependencies]
# HTTP client
reqwest = { workspace = true, features = ["json", "stream"] }

# Async runtime
tokio = { workspace = true, features = ["time"] }
async-trait = { workspace = true }
futures = { workspace = true, optional = true }
pin-project-lite = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Utilities
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
bytes = { workspace = true }
tracing = { workspace = true }
backoff = { workspace = true }
url = { workspace = true }
secrecy = { workspace = true }

# Streaming support
eventsource-stream = { workspace = true, optional = true }

[dev-dependencies]
tokio-test = { workspace = true }
wiremock = { workspace = true }
tempfile = { workspace = true }
serial_test = { workspace = true }

[[example]]
name = "chat"
path = "examples/chat.rs"

[[example]]
name = "streaming"
path = "examples/streaming.rs"

[[example]]
name = "embeddings"
path = "examples/embeddings.rs"

[[example]]
name = "rerank"
path = "examples/rerank.rs"
