[package]
name = "openrustclaw-distributed"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multi-node distributed mode for OpenRustClaw - horizontal scaling across machines"

[features]
default = []
raft-consensus = ["dep:raft", "dep:raft-proto"]
etcd = ["dep:etcd-client"]
consul = ["dep:consul"]
redis = ["dep:redis"]
mdns = ["dep:mdns-sd"]
full = ["raft-consensus", "etcd", "consul", "redis", "mdns"]

[dependencies]
# Internal crates
openrustclaw-core.workspace = true
openrustclaw-agent.workspace = true
openrustclaw-gateway.workspace = true
openrustclaw-memory.workspace = true
openrustclaw-observability.workspace = true

# Async runtime
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
pin-project-lite.workspace = true
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec", "time"] }

# Serialization
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true

# gRPC
tonic.workspace = true
prost.workspace = true
prost-types = "0.13"
tower.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Consensus (optional)
raft = { version = "0.7", optional = true }
raft-proto = { version = "0.7", optional = true }

# Service discovery (optional)
etcd-client = { version = "0.14", features = ["tls"], optional = true }
consul = { version = "0.4", optional = true }
mdns-sd = { version = "0.11", optional = true }

# Distributed state (optional)
redis = { version = "0.28", features = ["tokio-comp", "cluster-async", "connection-manager"], optional = true }

# Health checks
tonic-health = "0.12"

# Utilities
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
dashmap.workspace = true
config.workspace = true

# Hashing for consistent hashing
siphasher = "1"

# HTTP client
reqwest.workspace = true

# Metrics
metrics.workspace = true

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
tokio-test.workspace = true
tempfile.workspace = true
serial_test.workspace = true
wiremock.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
