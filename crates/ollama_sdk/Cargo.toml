[package]
name = "ollama-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native Rust SDK for Ollama API - Local LLM inference with comprehensive API support"
readme = "README.md"
keywords = ["ollama", "ai", "llm", "local", "api"]
categories = ["api-bindings", "asynchronous", "science"]
rust-version = "1.85"

[features]
default = ["rustls-tls", "streaming", "chat", "generate", "models", "embeddings"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
streaming = ["eventsource-stream", "futures"]
chat = []
generate = []
models = []
embeddings = []
vision = []
json-mode = []

[dependencies]
# HTTP client
reqwest = { workspace = true, features = ["json", "stream"] }

# Async runtime
tokio = { workspace = true, features = ["time", "fs"] }
async-trait = { workspace = true }
futures = { workspace = true, optional = true }
pin-project-lite = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Utilities
chrono = { workspace = true, features = ["serde"] }
bytes = { workspace = true }
tracing = { workspace = true }
backoff = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

# Streaming support
eventsource-stream = { workspace = true, optional = true }

[dev-dependencies]
tokio-test = { workspace = true }
wiremock = { workspace = true }
tempfile = { workspace = true }
serial_test = { workspace = true }
tracing-subscriber = { workspace = true }

[[example]]
name = "chat_completion"
path = "examples/chat_completion.rs"

[[example]]
name = "streaming_chat"
path = "examples/streaming_chat.rs"

[[example]]
name = "generate_text"
path = "examples/generate_text.rs"

[[example]]
name = "list_models"
path = "examples/list_models.rs"

[[example]]
name = "vision"
path = "examples/vision.rs"

[[example]]
name = "embeddings"
path = "examples/embeddings.rs"

[[example]]
name = "create_model"
path = "examples/create_model.rs"
