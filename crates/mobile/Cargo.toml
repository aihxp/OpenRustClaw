[package]
name = "openrustclaw-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mobile node SDK for iOS and Android - allows phones to act as OpenRustClaw nodes"

[dependencies]
openrustclaw-core.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
async-trait.workspace = true

# Mobile-specific (disabled by default)
tauri = { version = "1.5", optional = true }
uniffi = { version = "0.25", optional = true }

# iOS dependencies (optional, behind feature gate)
objc = { version = "0.2", optional = true }
cocoa = { version = "0.25", optional = true }

# Android dependencies (optional, behind feature gate)
jnix = { version = "0.5", features = ["derive"], optional = true }
ndk = { version = "0.8", optional = true }
ndk-sys = { version = "0.5", optional = true }

[dev-dependencies]
tokio-test.workspace = true
serial_test.workspace = true

[features]
default = []
tauri = ["dep:tauri"]
uniffi = ["dep:uniffi"]
ios = ["dep:objc", "dep:cocoa"]
android = ["dep:jnix", "dep:ndk", "dep:ndk-sys"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
