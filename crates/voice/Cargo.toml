[package]
name = "openrustclaw-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Voice processing and Talk Mode for OpenRustClaw"

[dependencies]
openrustclaw-core.workspace = true
openrustclaw-agent.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
bytes.workspace = true

# Audio processing
rubato = "0.15"      # Audio resampling
hound = "3.5"        # WAV file handling

# For real audio input/output and cloud TTS
cpal = "0.15"
rodio = "0.17"
reqwest.workspace = true
tempfile.workspace = true

[features]
default = ["tts"]
tts = []
