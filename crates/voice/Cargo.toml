[package]
name = "openrustclaw-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Voice processing and Talk Mode for OpenRustClaw"

[dependencies]
openrustclaw-core.workspace = true
openrustclaw-agent.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
bytes.workspace = true

# Audio processing (optional)
rubato = { version = "0.15", optional = true }
hound = { version = "3.5", optional = true }

# For real audio input/output and cloud TTS (optional)
cpal = { version = "0.15", optional = true }
rodio = { version = "0.17", optional = true }
reqwest.workspace = true
tempfile.workspace = true

[features]
default = ["tts"]
tts = []
audio = ["dep:cpal", "dep:rodio", "dep:rubato", "dep:hound"]
