[package]
name = "openrustclaw-channels"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Messaging platform integrations for OpenRustClaw"

[dependencies]
openrustclaw-core.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true

# Rate limiting
governor = "0.8"

# The following dependencies are for full implementations.
# Uncomment and add the correct versions when implementing full bot functionality:

# Telegram
# teloxide = { version = "0.17", features = ["macros"] }

# Discord  
# serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }

# Slack
# slack-morphism = { version = "2.19", features = ["hyper", "axum"] }
# slack-morphism-hyper = "0.41"

# Microsoft Teams & Google Chat
reqwest = { version = "0.12", features = ["json", "multipart"] }
jsonwebtoken = "9"

# LINE, WeChat (HMAC/SHA for webhook signature verification)
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
ed25519-dalek.workspace = true

# Gmail Pub/Sub
base64 = "0.22"

# Google Chat (for full implementation, uncomment):
# yup-oauth2 = "12"
# google-chat1 = "6"

# Gmail Pub/Sub (for full implementation, uncomment):
# google-cloud-pubsub = "0.28"
# yup-oauth2 = "12"

# Matrix (for full implementation, uncomment):
# matrix-sdk = { version = "0.10", default-features = false, features = ["e2e-encryption", "sqlite", "native-tls"] }

[dev-dependencies]
tokio-test.workspace = true
wiremock.workspace = true
