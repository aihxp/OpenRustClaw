[gateway]
host = "127.0.0.1"
port = 18789
allowed_origins = ["http://localhost:3000", "http://127.0.0.1:3000"]

[database]
url = "sqlite://data/openrustclaw.db"
wal_mode = true
max_connections = 10

[providers]
default_provider = "anthropic"
fallback_chain = ["anthropic", "openai", "openrouter"]

[providers.anthropic]
model = "claude-sonnet-4-20250514"
api_version = "2023-06-01"
strict_tools = true
streaming_tool_deltas = true

[providers.openai]
model = "gpt-4o"
use_responses_api = true
strict_tools = true

[providers.openrouter]
route_strategy = "quality"  # price, throughput, quality, web_search

[providers.ollama]
base_url = "http://localhost:11434"
model = "llama3.1"

[memory]
core_memory_max_tokens = 500
core_memory_max_entries = 20
embedding_concurrency = 4
dedupe_cosine_threshold = 0.92
decay_half_life_days = 30.0

[memory.ttl]
episodic_days = 90
semantic_days = 0   # 0 = never expire
procedural_days = 0 # 0 = never expire

[memory.consolidation]
enabled = true
threshold_entries = 1000
schedule_interval_hours = 24

[session_routing]
direct_strategy = "shared_main"  # shared_main, per_user
group_strategy = "isolated"      # isolated, shared_channel
thread_overrides_channel = true
pairing_approval_required = false
default_group_activation = "mention"
default_send_mode = "blocks"
default_chunk_chars = 1600
default_chunk_delay_ms = 250

[scheduler]
poll_interval_ms = 1000
lease_duration_secs = 60
max_retries = 3
base_retry_delay_secs = 5
max_retry_delay_secs = 300

[security]
require_auth = true
origin_validation = true
prompt_injection_defense = true
skill_signature_required = false  # marketplace only; workspace skills exempt
skill_verifying_key = null        # 32-byte Ed25519 public key as lowercase hex

[sidecar]
grpc_port = 50051
python_path = "python3"
role = "compatibility" # compatibility, experimental, disabled
auto_start = false
restart_on_crash = true

[observability]
langsmith_enabled = false
tracing_enabled = true
metrics_enabled = true
metrics_port = 9090

[channels]
# Telegram Bot Configuration
[channels.telegram]
enabled = false
token = ""  # Bot token from @BotFather
mode = "polling"  # "polling" or "webhook"
webhook_url = null  # Required for webhook mode (e.g., "https://yourdomain.com/webhook")
webhook_port = null  # Port to listen on for webhooks (e.g., 8080)
allowed_users = []  # List of allowed user IDs (empty = allow all)
rate_limit_per_second = 30  # Telegram allows ~30 msg/sec

# Discord Bot Configuration
[channels.discord]
enabled = false
token = ""  # Bot token from Discord Developer Portal
application_id = ""  # Application ID for slash commands
interaction_public_key = ""  # Public key for verified Discord Interactions ingress
attachment_download_dir = "./data/discord/downloads"  # Optional local download root for inbound forwarded attachments
rate_limit_requests_per_second = 5  # Discord global rate limit
allowed_guilds = []  # List of allowed server IDs (empty = allow all)
allowed_channels = []  # List of allowed channel IDs (empty = allow all)
dm_enabled = true  # Allow direct messages

# Slack App Configuration
[channels.slack]
enabled = false
token = ""  # Bot User OAuth Token (xoxb-...)
app_token = null  # App-Level Token (xapp-...) for Socket Mode
signing_secret = null  # Signing secret for HTTP mode webhook verification
mode = "socket_mode"  # "socket_mode" or "http"
socket_mode = true  # Use Socket Mode (recommended)
rate_limit_requests_per_second = 10  # Slack rate limit
allowed_workspaces = []  # List of allowed team IDs (empty = allow all)
app_home_enabled = true  # Enable App Home tab

# Microsoft Teams Bot Configuration
[channels.teams]
enabled = false
app_id = ""  # Microsoft App ID from Azure Bot registration
app_password = ""  # Microsoft App Password / client secret
tenant_id = null  # Azure tenant ID for single-tenant apps
webhook_path = "/webhooks/teams"  # Bot Framework webhook path
allowlist = []  # Allowed user emails or AAD object IDs (empty = allow all)
group_policy = "mention"  # "mention" or "open"
rate_limit_requests_per_second = 10  # Teams outbound rate limit
adaptive_cards_enabled = true  # Enable Adaptive Card responses
attachment_download_dir = "./data/teams/downloads"  # Optional local download root for inbound attachments

# Mattermost Bot Configuration
[channels.mattermost]
enabled = false
server_url = ""  # Mattermost base URL, e.g. https://chat.example.com
bot_token = ""  # Personal access token or bot token for API calls
webhook_path = "/webhooks/mattermost"  # Slash command / outgoing webhook ingress path
webhook_token = null  # Optional shared token for inbound request validation
bot_username = null  # Optional bot username for mention detection
allowlist = []  # Allowed user IDs or usernames (empty = allow all)
allowed_channels = []  # Allowed channel IDs (empty = allow all)
rate_limit_requests_per_second = 10

# Signal Messenger Configuration
[channels.signal]
enabled = false
phone_number = ""  # Your Signal phone number (E.164 format, e.g., +1234567890)
data_dir = "./data/signal"  # Path to store signal-cli data (keep secure!)
allowlist = []  # Allowed phone numbers (empty = allow all if require_allowlist = false)
allowed_groups = []  # Allowed group IDs (empty = allow all if require_allowlist = false)
signal_cli_path = null  # Path to signal-cli binary (null = use system PATH)
use_libsignal = false  # Use native libsignal-client (experimental)
rate_limit_per_minute = 20  # Signal rate limit (~20 messages/minute)
require_allowlist = true  # Require allowlist for security (recommended)

# iMessage / BlueBubbles Configuration
[channels.imessage]
enabled = false
allowlist = []  # Allowed phone numbers / Apple IDs (empty = allow all)
enable_tapbacks = true
enable_typing_indicator = false

[channels.imessage.bridge_mode]
mode = "macos_direct"  # "macos_direct", "bluebubbles", or "private_api"

# Google Chat Bot Configuration
[channels.google_chat]
enabled = false
service_account_key = ""  # Path to service-account JSON, token:<value>, or env:VAR
project_id = ""  # Google Cloud project ID
webhook_url = null  # Optional public webhook URL for Google Chat HTTP push
pubsub_subscription = null  # Optional Pub/Sub subscription for push-envelope mode
allowlist = []  # Allowed user emails or Google Workspace IDs (empty = allow all)
allowed_spaces = []  # Allowed Google Chat space IDs (empty = allow all)
rate_limit_requests_per_second = 10
cards_enabled = true
attachment_download_dir = "./data/google-chat/downloads"  # Optional local download root for inbound attachments
response_mode = "mention"  # "mention", "open", or "slash_commands"

# Google Meet Configuration
[channels.google_meet]
enabled = false
service_account_key_path = ""  # Path to service-account JSON, token:<value>, or env:VAR
delegated_user_email = ""  # Workspace user for domain-wide delegation
webhook_path = "/webhooks/google-meet/events"  # Workspace Events / Pub/Sub push endpoint
allowed_spaces = []  # Optional allowlist of Meet spaces
rate_limit_requests_per_second = 5
api_base_url = null  # Optional override for Meet API base URL
oauth_token_url = null  # Optional override for OAuth token URL
additional_scopes = []  # Extra Meet/Workspace scopes if needed
hydrate_transcript_events = true  # Fetch transcript entries for transcript events
