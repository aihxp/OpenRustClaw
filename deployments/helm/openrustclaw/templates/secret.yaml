{{- if not .Values.secrets.useExternal }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openrustclaw.fullname" . }}
  labels:
    {{- include "openrustclaw.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ include "openrustclaw.jwtSecret" . | b64enc | quote }}
  {{- include "openrustclaw.providerConfig" . }}
{{- end }}
