[project]
name = "openrustclaw-sidecar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langchain>=0.3",
    "langsmith>=0.3",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=5.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "pydantic>=2.0",
    "typing-extensions>=4.0",
    "python-dateutil>=2.8",
    "pytz>=2024.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.2",
]

[project.scripts]
openrustclaw-sidecar = "server:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["workflows", "evaluators", "proto"]
py-modules = ["server", "langsmith_bridge"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D"]
ignore = ["D100", "D104"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
